name: Validate Marketplace integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hacs.yml
      - custom_components/**
      - hacs.json
      - README.md
  pull_request:
    paths:
      - .github/workflows/hacs.yml
      - custom_components/**
      - hacs.json
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Marketplace integration
        # Marketplace retains the hacs.json metadata and HACS validation action.
        uses: hacs/action@main
        with:
          category: integration
          # GitHub's code-push credential cannot edit repository topics.
          # This is an action-only discoverability check, not a custom-repo
          # installation check. Remove this ignore after adding topics in GitHub.
          ignore: topics
