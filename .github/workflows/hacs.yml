name: Validate Marketplace integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hacs.yml
      - custom_components/**
      - hacs.json
      - README.md
      - tests/test_companion.py
      - tests/test_meter_identity.py
      - tests/test_update.py
      - tests/test_ota.py
  pull_request:
    paths:
      - .github/workflows/hacs.yml
      - custom_components/**
      - hacs.json
      - README.md
      - tests/test_companion.py
      - tests/test_meter_identity.py
      - tests/test_update.py
      - tests/test_ota.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Marketplace integration
        # Marketplace retains the hacs.json metadata and HACS validation action.
        uses: hacs/action@main
        with:
          category: integration

  companion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test companion behavior, meter identity, and OTA compatibility
        run: >-
          python -m unittest discover -s tests -p test_companion.py -v &&
          python -m unittest discover -s tests -p test_meter_identity.py -v &&
          python -m unittest discover -s tests -p test_update.py -v &&
          python -m unittest discover -s tests -p test_ota.py -v
